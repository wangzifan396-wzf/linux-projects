{{- /* 覆盖 PaperMod social_icons.html：用 absURL 替代 safeURL
   这样相对路径 url（如 rss 的 index.xml）会被正确拼接 baseURL 子路径，
   在任意页面深度都指向 /linux-projects/index.xml 而不是当前页路径下。
   absURL 对带 scheme 的 url（https://、mailto:）原样返回，不影响外链。 */ -}}
<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | absURL | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- end }}
</div>
