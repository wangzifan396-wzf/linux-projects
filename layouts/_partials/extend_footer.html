{{- /* 自定义扩展：滚动淡入 + 顶栏滚动收缩（用 IntersectionObserver + passive scroll） */ -}}
<script>
(function () {
    // 滚动淡入：给指定元素加 fade-up class，进入视口加 visible
    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (e.isIntersecting) {
                    e.target.classList.add('visible');
                    io.unobserve(e.target);
                }
            });
        }, { rootMargin: '0px 0px -40px 0px', threshold: 0.05 });

        // 文章卡片、首页信息块、TOC、文章正文块
        document.querySelectorAll(
            '.post-entry, .first-entry, .home-info, .toc, .post-content > *'
        ).forEach(function (el) {
            el.classList.add('fade-up');
            io.observe(el);
        });

        // 归档列表项也淡入
        document.querySelectorAll('.archive-entry').forEach(function (el) {
            el.classList.add('fade-up');
            io.observe(el);
        });
    } else {
        // 不支持 IO 的浏览器直接全部显示
        document.querySelectorAll('.post-entry, .first-entry, .home-info, .toc, .post-content > *')
            .forEach(function (el) { el.classList.add('visible'); });
    }

    // 顶栏滚动收缩 + 阴影
    var header = document.querySelector('.header');
    if (header) {
        var onScroll = function () {
            if (window.scrollY > 24) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    }
})();

{{- /* === Mermaid 图表懒加载（仅当页面含 .mermaid 元素且接近视口时加载） === */ -}}
(function () {
    var mermaidEls = document.querySelectorAll('.mermaid');
    if (mermaidEls.length === 0) return;

    var loaded = false;
    function loadMermaid() {
        if (loaded) return;
        loaded = true;
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
        s.onload = function () {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark'
                || document.body.getAttribute('data-theme') === 'dark';
            try {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: isDark ? 'dark' : 'default',
                    securityLevel: 'loose',
                    fontFamily: 'inherit'
                });
                mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
            } catch (e) { console.warn('mermaid render error:', e); }
        };
        document.head.appendChild(s);
    }

    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (e.isIntersecting) { loadMermaid(); io.disconnect(); }
            });
        }, { rootMargin: '200px 0px' });
        mermaidEls.forEach(function (el) { io.observe(el); });
    } else {
        loadMermaid();
    }
})();

{{- /* === 阅读进度条：仅文章页，跟随 .post-content 滚动位置 === */ -}}
(function () {
    var post = document.querySelector('.post-content');
    if (!post) return; // 非文章页不显示
    var bar = document.createElement('div');
    bar.className = 'reading-progress';
    document.body.appendChild(bar);
    var ticking = false;
    var onScroll = function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
            var rect = post.getBoundingClientRect();
            var postTop = rect.top + window.scrollY;
            var postHeight = rect.height - window.innerHeight;
            var scrolled = window.scrollY - postTop;
            var progress = postHeight > 0 ? scrolled / postHeight : 0;
            progress = Math.max(0, Math.min(1, progress));
            bar.style.width = (progress * 100) + '%';
            ticking = false;
        });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    onScroll();
})();
</script>
