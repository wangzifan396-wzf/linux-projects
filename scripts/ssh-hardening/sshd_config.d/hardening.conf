# SSH 加固配置片段
# 部署位置: /etc/ssh/sshd_config.d/hardening.conf
# Ubuntu 24.04 的 sshd 会自动读取 /etc/ssh/sshd_config.d/*.conf
# 部署后必须: sudo sshd -t && sudo systemctl reload ssh
#
# 注意：以下 Port 2222 是示例，改端口前先 ufw allow 新端口，否则会锁死

# ============ 端口与监听 ============
Port 2222                       # 改非常规端口；保留 22 的话注释这行
AddressFamily inet              # 只监听 IPv4
# ListenAddress 0.0.0.0         # 默认所有接口；绑特定 IP 取消注释

# ============ 认证类 ============
PermitRootLogin no              # 完全禁止 root 登录（Ubuntu 默认 prohibit-password）
PasswordAuthentication no       # 禁止密码登录（前提：公钥已能登）
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

# ============ 限制类 ============
AllowUsers wzf                  # 只允许这些用户（多用户空格分隔；可加 @IP 段限制来源）
MaxAuthTries 3                  # 单连接 3 次失败断
MaxSessions 4
LoginGraceTime 30
MaxStartups 10:30:60

# ============ 保活 ============
ClientAliveInterval 300
ClientAliveCountMax 2

# ============ 转发类（家用默认全关） ============
AllowTcpForwarding no
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
